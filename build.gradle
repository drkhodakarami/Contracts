plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.dynamero.props' version '1.0.0'
}

repositories {
    mavenCentral() // Required to download slf4j-api
}

group = 'com.dynamero.contracts'
version = '1.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // Standard logging API for libraries
    api 'org.slf4j:slf4j-api:2.0.16'
}

def local = props.load('local')

def repsyUrl = local.REPSY_URL
def repsyUsername = local.REPSY_USERNAME
def repsyPassword = local.REPSY_PASSWORD

publishing {
    setupRepositories(repositories, repsyUrl, repsyUsername, repsyPassword)

    publications {
        mavenJava(MavenPublication) {
            artifactId = project.name

            from components.java

            pom {
                name = "Contracts"
                description = "Contracts library containing annotations and exceptions."
                url = "https://github.com/drkhodakarami/Contracts/tree/HEAD/${project.rootDir.relativePath(project.projectDir)}"
                licenses {
                    license {
                        name = "LGPL-3.0"
                        url = "https://www.gnu.org/licenses/lgpl-3.0.html"
                    }
                }
                developers {
                    developer {
                        name = "TheMentor"
                        url = "https://www.dynamero.com"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/drkhodakarami/Contracts.git"
                    url = "https://github.com/drkhodakarami/Contracts"
                    developerConnection = "scm:git:git@github.com:drkhodakarami/Contracts.git"
                }
                issueManagement {
                    system = "GitHub"
                    url = "https://github.com/drkhodakarami/Contracts/issues"
                }
            }
        }
    }
}

void setupRepositories(RepositoryHandler repositories, String repsyUrl, String repsyUsername, String repsyPassword) {
    repositories.mavenLocal()
    if (repsyUrl) {
        repositories.maven {
            url = repsyUrl
            credentials {
                username = repsyUsername
                password = repsyPassword
            }
        }
    }
}